<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lotto Lab</title>
    <!--
      Tema antes do primeiro paint: sem isto o app abre claro e pisca para o
      escuro quando o useTheme monta. Mantenha a chave igual a de shared/ui/theme.ts.
    -->
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem('lotto.theme') ||
        (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
